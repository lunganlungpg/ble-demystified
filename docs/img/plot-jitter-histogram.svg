<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380">
  <style>
    .bg { fill: #0f172a; }
    .grid { stroke: #1e293b; stroke-width: 1; }
    .axis { stroke: #334155; stroke-width: 1.5; }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .text-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .text-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #94a3b8; }
    .text-axis { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
    .line-primary { fill: none; stroke: #38bdf8; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .line-accent { fill: none; stroke: #f43f5e; stroke-width: 2.0; stroke-linejoin: round; stroke-linecap: round; }
    .area-primary { fill: rgba(56, 189, 248, 0.12); }
    .legend-box { fill: #1e293b; stroke: #334155; rx: 6; }
  </style>
  <rect width="780" height="380" rx="10" class="bg" />
  <!-- Header -->
  <text x="40" y="34" class="text-title">Notification Inter-Arrival Timing & Jitter Histogram</text>
  <text x="40" y="50" class="text-subtitle">BLE Demystified Telemetry Engine &bull; Link Layer Capture</text>
  
    <!-- Axis lines -->
    <line x1="65" y1="325" x2="740" y2="325" class="axis" />
    
      <rect x="81.875" y="181.66666666666666" width="78.75" height="143.33333333333334" rx="4" fill="#64748b" />
      <text x="121.25" y="173.66666666666666" text-anchor="middle" class="text-label">86</text>
      <text x="121.25" y="345" text-anchor="middle" class="text-label">18-20ms</text>
    
      <rect x="194.375" y="156.66666666666666" width="78.75" height="168.33333333333334" rx="4" fill="#38bdf8" />
      <text x="233.75" y="148.66666666666666" text-anchor="middle" class="text-label">101</text>
      <text x="233.75" y="345" text-anchor="middle" class="text-label">20-22ms</text>
    
      <rect x="306.875" y="320" width="78.75" height="5" rx="4" fill="#64748b" />
      <text x="346.25" y="312" text-anchor="middle" class="text-label">3</text>
      <text x="346.25" y="345" text-anchor="middle" class="text-label">22-24ms</text>
    
      <rect x="419.375" y="323.3333333333333" width="78.75" height="1.6666666666666667" rx="4" fill="#64748b" />
      <text x="458.75" y="315.3333333333333" text-anchor="middle" class="text-label">1</text>
      <text x="458.75" y="345" text-anchor="middle" class="text-label">24-28ms</text>
    
      <rect x="531.875" y="325" width="78.75" height="0" rx="4" fill="#64748b" />
      <text x="571.25" y="317" text-anchor="middle" class="text-label">0</text>
      <text x="571.25" y="345" text-anchor="middle" class="text-label">28-36ms</text>
    
      <rect x="644.375" y="310" width="78.75" height="15" rx="4" fill="#f43f5e" />
      <text x="683.75" y="302" text-anchor="middle" class="text-label">9</text>
      <text x="683.75" y="345" text-anchor="middle" class="text-label">38-42ms</text>
    
    
    <g transform="translate(233.75, 105)">
      <rect width="210" height="48" rx="6" fill="#1e293b" stroke="#38bdf8" />
      <text x="12" y="20" class="text-label" fill="#38bdf8" font-weight="bold">Connection Interval Peak (20ms)</text>
      <text x="12" y="36" class="text-subtitle">Clock drift jitter: &plusmn;0.8 ms</text>
    </g>
  
    <text x="390" y="365" text-anchor="middle" class="text-axis">Packet Inter-Arrival Time Window (ms)</text>
    <text x="18" y="200" transform="rotate(-90 18 200)" text-anchor="middle" class="text-axis">Frequency (Packet Count)</text>
  
</svg>