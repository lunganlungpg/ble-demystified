# Publishes this repository to GitHub Packages and builds installable archives.
#
#  * container  -> ghcr.io/lunganlungpg/ble-demystified  (appears under the "Packages" tab of the
#                  repo and of github.com/lunganlungpg). Tags: latest (main),
#                  sha-<commit>, and X.Y.Z when a vX.Y.Z tag is pushed.
#
# Runs on every push to main, on version tags, and manually ("Run workflow").
name: Publish packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # needed to push the image to ghcr.io with GITHUB_TOKEN

env:
  # ghcr.io names must be lowercase, so the name is spelled out here.
  IMAGE: ghcr.io/lunganlungpg/ble-demystified

jobs:
  container:
    name: Container image -> ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags plus OCI labels; the `source` label links the package
      # to this repository so it shows up on the repo page.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
